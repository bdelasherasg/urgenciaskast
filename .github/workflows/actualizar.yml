name: Actualizar urgencias

# Corre cada 3 horas y también cuando se publica una ficha, se edita una página en fuente/
# o cambia el código del sitio. Nunca borra ni modifica el archivo CNAME del dominio.
on:
  schedule:
    # Cada 3 horas, en el minuto 17 (hora UTC).
    - cron: '17 */3 * * *'
  push:
    branches: [main]
    paths:
      - 'fuente/**'
      - 'data/fichas/**'
      - 'data/citaciones_camara.json'
      - 'data/analisis.json'
      - 'data/glosario.json'
      - 'assets/**'
      - 'scripts/**'
      - 'package.json'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: actualizar-urgencias
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Urgencias (Senado y Cámara)
        # Si ninguna consulta responde, el archivo anterior se conserva y el resto sigue.
        # El tope de tiempo de este paso no detiene los siguientes.
        timeout-minutes: 25
        continue-on-error: true
        run: python -u scripts/actualizar.py || echo "::warning::No se actualizaron las urgencias; se conserva el archivo anterior."

      - name: Agenda de dos semanas
        timeout-minutes: 12
        continue-on-error: true
        run: python -u scripts/agenda.py

      - name: Producción de Lo Común
        run: |
          if curl -fsSL --max-time 30 https://locomun.cl/contenido/feed.json -o /tmp/locomun.json \
             && python -m json.tool /tmp/locomun.json > /dev/null; then
            cp /tmp/locomun.json data/locomun.json
          else
            echo "::warning::No se pudo leer locomun.cl; se conserva la copia anterior."
          fi

      - name: Páginas, fichas, resumen y mapa del sitio
        run: python -u scripts/paginas.py --sitio

      - name: Fichas en el HTML inicial
        # Dibuja cada ficha con assets/app.js y la escribe en el HTML, para que buscadores y agentes de IA lean lo mismo que una persona.
        continue-on-error: true
        run: |
          npm install --no-audit --no-fund --silent
          node scripts/prerender.mjs

      - name: Publicar
        run: |
          git config user.name "urgencias-bot"
          git config user.email "urgencias-bot@users.noreply.github.com"
          git add data p sitemap.xml llms.txt robots.txt assets/glosario.js ./*.html analisis
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Actualiza urgencias, agenda y fichas"
            git pull --rebase origin main
            git push
          fi

      - name: Avisar a los buscadores (IndexNow)
        continue-on-error: true
        run: |
          sleep 90
          python scripts/indexnow.py
