name: Actualizar urgencias

on:
  schedule:
    # Cada 3 horas, en el minuto 17 (hora UTC).
    - cron: '17 */3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: actualizar-urgencias
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Consultar Senado y Cámara
        run: python scripts/actualizar.py

      - name: Publicar datos nuevos
        run: |
          git config user.name "urgencias-bot"
          git config user.email "urgencias-bot@users.noreply.github.com"
          git add data/urgencias.json
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
          else
            git commit -m "Actualiza urgencias"
            git push
          fi
