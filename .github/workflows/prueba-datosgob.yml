name: Prueba temporal datos.gob.cl
on:
  push:
    branches: [ccr-5b1bef4b-04qowc]
    paths: ['.github/workflows/prueba-datosgob.yml']
jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          curl -sS -m 60 -o ckan.json -w "CKAN %{http_code}\n" "https://datos.gob.cl/api/3/action/package_search?q=%22ley%20de%20presupuestos%20inicial%20y%20vigente%22&rows=1&sort=metadata_modified%20desc"
          python3 -c "import json;r=json.load(open('ckan.json'))['result']['results'][0];print(r['title']);u=[x['url'] for x in r['resources'] if 'Partida' in x['name']][0];print(u);open('u','w').write(u)"
          curl -sSL -m 60 -o p.csv -w "CSV %{http_code} %{size_download}\n" "$(cat u)"
          head -3 p.csv
